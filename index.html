<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=/public/">
    <script>
        if (window.location.port !== "3000" && window.location.pathname === "/") {
            window.location.href = "/public/";
        }
    </script>
    <title>BATCH Culinary Lab - Redirecting</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #121214; color: #e1e1e6; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center; max-width: 460px; padding: 24px; border: 1px solid #29292e; border-radius: 8px; background: #1a1a1e;">
        <h2 style="margin: 0 0 10px 0; letter-spacing: 1px;">BATCH CULINARY LAB</h2>
        <p style="color: #a8a8b3; font-size: 0.9rem; margin-bottom: 16px;">Redirecting to the application workspace...</p>
        <p><a href="/public/" style="color: #ff9000; text-decoration: none; font-weight: bold;">Click here if not redirected automatically &rarr;</a></p>
        <div style="margin-top: 20px; padding-top: 14px; border-top: 1px dashed #323238; font-size: 0.8rem; color: #737380;">
            For full AI generation, please launch via <code>npm start</code> at <br>
            <a href="http://localhost:3000" style="color: #ff9000;">http://localhost:3000</a>
        </div>
    </div>
</body>
</html>
